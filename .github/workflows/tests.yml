name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check polyserve tests benchmarks
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The real image builds on vllm/vllm-openai (tens of GB); a slim base checks the Dockerfile's own steps.
      - run: docker build --build-arg BASE_IMAGE=python:3.12-slim -t polyserve-ci .
      - run: docker run --rm polyserve-ci --help
      - run: docker run --rm polyserve-ci workloads
