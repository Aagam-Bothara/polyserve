[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyserve"
version = "0.1.0"
description = "Autotuner for LLM serving: measures vLLM, SGLang and llama.cpp settings on your GPU and your traffic, then serves the fastest"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "Aagam Sachin Bothara", email = "mweeb19@gmail.com"}]
keywords = ["llm", "inference", "vllm", "llama.cpp", "serving", "autotuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psutil>=5.9",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
nvml = ["nvidia-ml-py>=12.535.133"]
# llmtrace, the GPU tracer PolyServe prefers for telemetry (it falls back to pynvml, then psutil), is not an
# extra: PyPI refuses packages with git dependencies, and "llmtrace" on PyPI is an unrelated project. Install
# it from git: pip install "llmtrace @ git+https://github.com/Aagam-Bothara/llmtrace.git"
# ruff is pinned: its default rules change between releases (0.16 added pyupgrade), so an unpinned
# linter passed locally and failed in CI on the same code.
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff==0.15.0"]

[project.urls]
Homepage = "https://github.com/Aagam-Bothara/polyserve"
Documentation = "https://github.com/Aagam-Bothara/polyserve/blob/main/docs/usage.md"
Benchmarks = "https://github.com/Aagam-Bothara/polyserve/blob/main/docs/benchmarks.md"
Issues = "https://github.com/Aagam-Bothara/polyserve/issues"

[project.scripts]
polyserve = "polyserve.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["polyserve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # explicit, so the rule set does not move with ruff's defaults
